name: Catalog refresh PR check

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/content/analog/**'
      - 'src/content/digital/**'
      - 'src/data/analog-activity.json'
      - 'src/data/digital-activity.json'
      - 'docs/CATALOG_EXPANSION_REVIEW_2026-09-14.md'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install chromium --with-deps
      - run: npm run test:smoke
