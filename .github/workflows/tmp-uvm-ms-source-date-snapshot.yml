name: Temporary UVM-MS source-date snapshot refresh

on:
  push:
    branches:
      - research/uvm-ms-standardization-adoption

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/uvm-ms-standardization-adoption
      - name: Refresh exact source-date snapshot
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/smoke/release.spec.mjs')
          s = p.read_text()
          old = "  expect(globalWaveEvents.flatMap(({ sources }) => sources).every(({ checkedAt }) => checkedAt === '2026-08-30')).toBe(true);"
          new = """  expect(globalWaveEvents\n    .filter(({ id }) => id !== 'xilinx-2015-octave-rnm-uvm-verification')\n    .flatMap(({ sources }) => sources)\n    .every(({ checkedAt }) => checkedAt === '2026-08-30')).toBe(true);\n  expect(payload.events.find(({ id }) => id === 'xilinx-2015-octave-rnm-uvm-verification').sources\n    .map(({ checkedAt }) => checkedAt)).toEqual(['2026-09-02', '2026-09-02']);"""
          if old not in s:
              raise SystemExit('missing global-wave source-date snapshot')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit snapshot refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/smoke/release.spec.mjs
          git commit -m "Refresh Xilinx source-date smoke snapshot"
          git push origin HEAD:research/uvm-ms-standardization-adoption
