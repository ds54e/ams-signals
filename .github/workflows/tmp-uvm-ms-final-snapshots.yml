name: Temporary UVM-MS final snapshot refresh

on:
  push:
    branches:
      - research/uvm-ms-standardization-adoption

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/uvm-ms-standardization-adoption
      - name: Refresh exact corpus-derived snapshots
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/smoke/release.spec.mjs')
          s = p.read_text()
          replacements = {
              'expect(payload.people).toHaveLength(26);': 'expect(payload.people).toHaveLength(27);',
              'expect(activePersonIds).toHaveLength(26);': 'expect(activePersonIds).toHaveLength(27);',
              'expect(defaultVisibleCombinedKeys).toHaveLength(48);': 'expect(defaultVisibleCombinedKeys).toHaveLength(49);',
              'expect(representedIds).toHaveLength(150);': 'expect(representedIds).toHaveLength(151);',
              "toHaveText('150 of 172 events')": "toHaveText('151 of 172 events')",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing snapshot: {old}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Commit snapshot refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/smoke/release.spec.mjs
          git commit -m "Refresh UVM-MS final smoke snapshots"
          git push origin HEAD:research/uvm-ms-standardization-adoption
