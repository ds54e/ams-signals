name: Temporary catalog activity refresh

on:
  push:
    branches:
      - catalog-refresh-2026-09-18
    paths-ignore:
      - src/data/analog-activity.json
      - src/data/digital-activity.json

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: catalog-refresh-2026-09-18

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Refresh Analog and Digital activity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run refresh:analog-activity
          npm run refresh:digital-activity

      - name: Commit refreshed snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/analog-activity.json src/data/digital-activity.json
          if git diff --cached --quiet; then
            echo "No activity changes"
          else
            git commit -m "chore: refresh catalog activity snapshots"
            git push origin HEAD:catalog-refresh-2026-09-18
          fi
