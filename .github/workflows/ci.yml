name: CI

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 0'

permissions:
  contents: read

# Cancel stale PR checks without canceling independent main-push validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  impact:
    name: Classify change
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      core_only: ${{ steps.scope.outputs.core_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Determine regression scope
        id: scope
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node tools/ci-impact.mjs "$BASE_SHA" >> "$GITHUB_OUTPUT"

  validate:
    name: Deterministic validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate root-domain deployment shape
        env:
          SITE: https://migration-test.invalid
          BASE_URL: /
        run: npm run build && npm run check:internal-links

      # Audit the fallback build independently of the browser jobs.
      - name: Deterministic checks
        run: npm run check

  browser:
    needs: impact
    uses: ./.github/workflows/browser.yml
    with:
      core_only: ${{ needs.impact.outputs.core_only == 'true' }}

  gate:
    name: Validate and test
    if: ${{ always() }}
    needs: [impact, validate, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every validation job
        env:
          IMPACT: ${{ needs.impact.result }}
          STATIC: ${{ needs.validate.result }}
          BROWSER: ${{ needs.browser.result }}
        run: test "$IMPACT" = success && test "$STATIC" = success && test "$BROWSER" = success
