name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel stale PR checks without canceling independent main-push validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate root-domain deployment shape
        env:
          SITE: https://migration-test.invalid
          BASE_URL: /
        run: npm run build && npm run check:internal-links

      # Leave the audited fallback build in dist for Chromium.
      - name: Deterministic checks
        run: npm run check

      - name: Install Chromium headless shell
        run: npx playwright install --with-deps --only-shell chromium

      - name: Chromium smoke tests
        run: npx playwright test

      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-evidence
          path: test-results/
          if-no-files-found: ignore
          include-hidden-files: false
          retention-days: 7
