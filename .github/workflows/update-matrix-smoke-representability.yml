name: Update matrix representability smoke check

on:
  push:
    branches:
      - research/pre-post-silicon-portability

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/pre-post-silicon-portability
          fetch-depth: 0
      - name: Generalize matrix mark expectation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/smoke/release.spec.mjs')
          text = path.read_text()
          old = "  expect(new Set(marks.map(({ id }) => id))).toEqual(new Set(serialized.map(({ id }) => id)));"
          new = """  const matrixRepresentableIds = serialized
    .filter((event) => event.companies.length > 0 || event.people.length > 0)
    .map(({ id }) => id);
  expect(new Set(marks.map(({ id }) => id))).toEqual(new Set(matrixRepresentableIds));"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one match, found {count}')
          path.write_text(text.replace(old, new))
          PY
      - name: Remove temporary updater and commit test fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-matrix-smoke-representability.yml
          git add tests/smoke/release.spec.mjs
          git diff --cached --check
          git commit -m "Handle entityless events in matrix smoke test"
          git push origin HEAD:research/pre-post-silicon-portability
