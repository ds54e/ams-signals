name: Update matrix representability smoke check

on:
  push:
    branches:
      - research/pre-post-silicon-portability

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/pre-post-silicon-portability
          fetch-depth: 0
      - name: Clarify entityless Event coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/smoke/release.spec.mjs')
          text = path.read_text()

          old_matrix = "  expect(new Set(marks.map(({ id }) => id))).toEqual(new Set(serialized.map(({ id }) => id)));"
          new_matrix = "\n".join([
              "  const matrixRepresentableIds = serialized",
              "    .filter((event) => event.companies.length > 0 || event.people.length > 0)",
              "    .map(({ id }) => id);",
              "  expect(new Set(marks.map(({ id }) => id))).toEqual(new Set(matrixRepresentableIds));",
              "  expect(matrixRepresentableIds).not.toContain('ecosystem-2026-08-pss-3-1-public-review');",
          ])
          if text.count(old_matrix) != 1:
              raise SystemExit(f'expected one matrix assertion, found {text.count(old_matrix)}')
          text = text.replace(old_matrix, new_matrix)

          old_events = """  await expect(page.locator(\n    '[data-event-result][data-event-id=\"stijn-ringeling-2026-ml-sigma-delta-evaluation\"]',\n  )).toBeVisible();"""
          new_events = old_events + "\n" + "\n".join([
              "  await expect(page.locator(",
              "    '[data-event-result][data-event-id=\"ecosystem-2026-08-pss-3-1-public-review\"]',",
              "  )).toBeVisible();",
          ])
          if text.count(old_events) != 1:
              raise SystemExit(f'expected one Events anchor, found {text.count(old_events)}')
          text = text.replace(old_events, new_events)

          path.write_text(text)
          PY
      - name: Remove temporary updater and commit test fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-matrix-smoke-representability.yml
          git add tests/smoke/release.spec.mjs
          git diff --cached --check
          git commit -m "Handle entityless events in matrix smoke test"
          git push origin HEAD:research/pre-post-silicon-portability
