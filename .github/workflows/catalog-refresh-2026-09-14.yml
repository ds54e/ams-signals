name: Catalog refresh 2026-09-14

on:
  push:
    branches:
      - catalog-refresh-2026-09-14

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message == 'Run catalog activity refresh'
    runs-on: ubuntu-latest
    env:
      AMS_SIGNALS_CAPTURED_AT: '2026-09-14T00:00:00.000Z'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Seed new activity records
        run: node tools/catalog-refresh-2026-09-14.mjs
      - name: Pin the one-shot capture timestamp
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          for (const path of ['tools/refresh-analog-activity.mjs', 'tools/refresh-digital-activity.mjs']) {
            const before = await readFile(path, 'utf8');
            const after = before.replace(
              'const capturedAt = new Date().toISOString();',
              'const capturedAt = process.env.AMS_SIGNALS_CAPTURED_AT ?? new Date().toISOString();',
            );
            if (after === before) throw new Error(`capture hook not found in ${path}`);
            await writeFile(path, after);
          }
          NODE
      - run: npm run refresh:analog-activity
      - run: npm run refresh:digital-activity
      - name: Remove one-shot helpers
        run: |
          git checkout -- tools/refresh-analog-activity.mjs tools/refresh-digital-activity.mjs
          rm -f tools/catalog-refresh-2026-09-14.mjs
          rm -f .github/workflows/catalog-refresh-2026-09-14.yml
          rm -f .catalog-refresh-trigger
      - run: npm run check
      - name: Commit refreshed catalogs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Refresh Analog and Digital catalogs for 2026-09-14"
          git push
